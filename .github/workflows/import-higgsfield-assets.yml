name: Import Higgsfield 3D Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-higgsfield-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download actual Higgsfield GLBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models/higgsfield

          curl -fL --retry 3 --retry-delay 2 \
            'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/2db4d662-d12d-4ef5-b151-124a8e9bb4b4/revisions/00000001-build-high-poly-farmhouse-v1/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260915T141008Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260915%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=79c40875371f34722eb8d5ea8ad5970f1675633aa662357d205f06b119ff9fca' \
            -o assets/models/higgsfield/farmhouse_highpoly.glb

          curl -fL --retry 3 --retry-delay 2 \
            'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/055c56d6-9503-404e-beb8-89aa30f447c2/revisions/00000001-build-hi-poly-tools-v2/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260915T141015Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260915%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=e4e9d6d4a0cd288eda7ac3cc83c5d786781df0764d0cf1326f993561b304b566' \
            -o assets/models/higgsfield/tools_highpoly.glb

          test "$(stat -c%s assets/models/higgsfield/farmhouse_highpoly.glb)" -gt 4000000
          test "$(stat -c%s assets/models/higgsfield/tools_highpoly.glb)" -gt 5000000
          ls -lh assets/models/higgsfield

      - name: Commit models to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/higgsfield/farmhouse_highpoly.glb assets/models/higgsfield/tools_highpoly.glb
          git commit -m 'Add actual Higgsfield high-poly farmhouse and tool GLBs'
          git push origin HEAD:main
