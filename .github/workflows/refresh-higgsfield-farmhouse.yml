name: Refresh Higgsfield Farmhouse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-higgsfield-farmhouse.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download corrected baked farmhouse GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models/higgsfield
          curl -fL --retry 3 --retry-delay 2 \
            'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/2db4d662-d12d-4ef5-b151-124a8e9bb4b4/revisions/00000002-bake-farmhouse-for-godot-v2/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260915T143709Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260915%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=eddc99a3444c391f64789b7c803aa9f2a0278d51fdd7d92fe6417551451db134' \
            -o assets/models/higgsfield/farmhouse_highpoly.glb
          test "$(stat -c%s assets/models/higgsfield/farmhouse_highpoly.glb)" -gt 14000000
      - name: Commit corrected farmhouse
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/higgsfield/farmhouse_highpoly.glb
          git commit -m 'Replace farmhouse with Godot-safe baked Higgsfield export'
          git push origin HEAD:main
